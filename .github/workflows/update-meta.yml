name: Update meta analysis

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'meta/loc.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate meta analysis data
        run: npm run update-meta

      - name: Commit refreshed meta data
        run: |
          if git diff --quiet -- meta/loc.csv; then
            echo "meta/loc.csv is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/loc.csv
          git commit -m "Update meta analysis data"
          git push
